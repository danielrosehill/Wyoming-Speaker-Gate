[project]
name = "wyoming-speaker-gate"
version = "1.0"
description = "Wyoming STT proxy that only passes speech from enrolled speakers"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["wyoming>=1.5", "numpy", "soundfile", "librosa", "pyannote.audio>=3.3"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["speaker_gate"]
